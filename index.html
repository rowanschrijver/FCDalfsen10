<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamManager Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase Client Library voor live sync -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .pitch-bg {
      background: linear-gradient(to bottom, #15803d, #166534);
      border: 2px solid rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-12">

  <!-- PINCODE INLOGSCHERM -->
  <div id="pin-overlay" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full text-center space-y-4">
      <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-800">Team Toegang</h2>
      <p class="text-xs text-slate-500">Voer de teampincode in om toegang te krijgen.</p>
      
      <form id="pin-form" class="space-y-3">
        <input type="password" id="pin-input" placeholder="Pincode" maxlength="4" autofocus required class="w-full text-center text-2xl tracking-widest p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        <p id="pin-error" class="text-xs text-rose-500 font-medium hidden">Onjuiste pincode, probeer opnieuw.</p>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition cursor-pointer">Inloggen</button>
      </form>
    </div>
  </div>

  <!-- HOOFD APPLICATIE -->
  <div id="app-content" class="hidden">
    
    <!-- Header -->
    <header class="bg-emerald-700 text-white shadow-md">
      <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-futbol"></i> TeamManager Pro
        </h1>
        <div class="flex items-center gap-3">
          <span id="sync-status" class="text-[10px] bg-emerald-800 px-2.5 py-1 rounded-full text-emerald-200">Verbinden...</span>
          <button id="btn-logout" class="text-xs bg-emerald-800 hover:bg-emerald-900 px-3 py-1
