<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamManager Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <style>
    .pitch {
      background: linear-gradient(to bottom, #15803d, #166534);
      background-size: 100% 40px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      position: relative;
    }
    .pitch-line {
      position: absolute;
      border: 2px solid rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }
    .center-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .halfway-line {
      top: 50%;
      width: 100%;
      height: 0;
    }
    .penalty-area-top {
      top: 0;
      left: 20%;
      width: 60%;
      height: 18%;
    }
    .penalty-area-bottom {
      bottom: 0;
      left: 20%;
      width: 60%;
      height: 18%;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-emerald-700 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
        <i class="fa-solid font-bold fa-futbol"></i> TeamManager Pro
      </h1>
      <span class="text-xs bg-emerald-800 px-3 py-1 rounded-full text-emerald-100 font-medium">Amateur Matchday</span>
    </div>
  </header>

  <div class="max-w-4xl mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Kolom Links: Selectie & Spelersbeheer -->
    <div class="space-y-6">
      
      <!-- Speler Toevoegen -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-700 mb-3 flex items-center gap-2 text-sm uppercase tracking-wider">
          <i class="fa-solid fa-user-plus text-emerald-600"></i> Speler Toevoegen
        </h2>
        <form id="add-player-form" class="space-y-3">
          <input type="text" id="player-name" placeholder="Naam speler" required class="w-full text-sm p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <div class="flex gap-2">
            <input type="number" id="player-number" placeholder="Nr" min="1" max="99" class="w-1/3 text-sm p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <select id="player-pos" class="w-2/3 text-sm p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="KEEPER">Keeper</option>
              <option value="VERDEDIGER">Verdediger</option>
              <option value="MIDDENVELDER">Middenvelder</option>
              <option value="AANVALLER">Aanvaller</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm py-2 rounded-lg transition">Toevoegen</button>
        </form>
      </div>

      <!-- Selectie & Aanwezigheid -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-slate-700 flex items-center gap-2 text-sm uppercase tracking-wider">
            <i class="fa-solid fa-users text-emerald-600"></i> Selectie (<span id="player-count">0</span>)
          </h2>
          <span class="text-xs text-slate-500">Aanwezig / Status</span>
        </div>
        <div id="player-list" class="space-y-2 max-h-80 overflow-y-auto pr-1">
          <!-- Dynamisch gevuld -->
        </div>
      </div>

    </div>

    <!-- Kolom Midden/Rechts: Wedstrijddetails, Veld & Taken -->
    <div class="md:col-span-2 space-y-6">

      <!-- Wedstrijd Details Card -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-700 mb-4 flex items-center gap-2 text-sm uppercase tracking-wider">
          <i class="fa-solid fa-calendar-day text-emerald-600"></i> Wedstrijd van de Week
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Tegenstander</label>
            <input type="text" id="match-opponent" value="FC Bal op het Dak 3" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Thuis / Uit</label>
            <select id="match-type" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
              <option value="Thuis">Thuis</option>
              <option value="Uit" selected>Uit</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Aanvangstijd</label>
            <input type="time" id="match-time" value="14:30" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Verzameltijd</label>
            <input type="time" id="meet-time" value="13:15" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>
      </div>

      <!-- Opstelling op het veld -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-slate-700 flex items-center gap-2 text-sm uppercase tracking-wider">
            <i class="fa-solid fa-chess-board text-emerald-600"></i> Opstelling
          </h2>
          <select id="formation-select" class="text-xs p-1.5 border border-slate-300 rounded-lg font-medium">
            <option value="4-3-3">Formatie: 4-3-3</option>
            <option value="4-4-2">Formatie: 4-4-2</option>
            <option value="3-5-2">Formatie: 3-5-2</option>
          </select>
        </div>

        <!-- Voetbalveld Visualisatie -->
        <div class="pitch w-full h-[420px] rounded-lg p-3 flex flex-col justify-between relative overflow-hidden shadow-inner">
          <div class="pitch-line center-circle"></div>
          <div class="pitch-line halfway-line"></div>
          <div class="pitch-line penalty-area-top"></div>
          <div class="pitch-line penalty-area-bottom"></div>

          <!-- Linies op het veld -->
          <div id="line-attack" class="flex justify-around items-center z-10 w-full min-h-[50px]"></div>
          <div id="line-midfield" class="flex justify-around items-center z-10 w-full min-h-[50px]"></div>
          <div id="line-defense" class="flex justify-around items-center z-10 w-full min-h-[50px]"></div>
          <div id="line-keeper" class="flex justify-center items-center z-10 w-full min-h-[50px]"></div>
        </div>
      </div>

      <!-- Logistiek & Rijders -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <h3 class="font-bold text-slate-700 mb-2 text-xs uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-car text-emerald-600"></i> Rijders / Auto's
          </h3>
          <input type="text" id="task-drivers" placeholder="bijv. Jan (4), Piet (3)" class="w-full text-sm p-2 border border-slate-300 rounded-lg">
        </div>
        <div>
          <h3 class="font-bold text-slate-700 mb-2 text-xs uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-shirt text-emerald-600"></i> Waskeur / Fruit / Vlaggen
          </h3>
          <input type="text" id="task-wash" placeholder="bijv. Was: Klaas | Vlaggen: Mark" class="w-full text-sm p-2 border border-slate-300 rounded-lg">
        </div>
      </div>

      <!-- WhatsApp Generator Button -->
      <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-center gap-3">
        <div>
          <h4 class="font-bold text-emerald-900 text-sm">Klaar om te delen?</h4>
          <p class="text-xs text-emerald-700">Genereer een strak bericht voor in de WhatsApp-groep.</p>
        </div>
        <button id="btn-copy-whatsapp" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm px-4 py-2.5 rounded-lg flex items-center justify-center gap-2 transition">
          <i class="fa-brands fa-whatsapp text-lg"></i> Kopieer App-Tekst
        </button>
      </div>

    </div>

  </div>

  <script>
    // Standaard Spelers
    let defaultPlayers = [
      { id: 1, name: 'Daan', number: 1, pos: 'KEEPER', status: 'aanwezig' },
      { id: 2, name: 'Lars', number: 2, pos: 'VERDEDIGER', status: 'aanwezig' },
      { id: 3, name: 'Sven', number: 4, pos: 'VERDEDIGER', status: 'aanwezig' },
      { id: 4, name: 'Milan', number: 5, pos: 'VERDEDIGER', status: 'afwezig' },
      { id: 5, name: 'Bram', number: 3, pos: 'VERDEDIGER', status: 'aanwezig' },
      { id: 6, name: 'Luuk', number: 6, pos: 'MIDDENVELDER', status: 'aanwezig' },
      { id: 7, name: 'Finn', number: 8, pos: 'MIDDENVELDER', status: 'aanwezig' },
      { id: 8, name: 'Jesse', number: 10, pos: 'MIDDENVELDER', status: 'aanwezig' },
      { id: 9, name: 'Sem', number: 7, pos: 'AANVALLER', status: 'aanwezig' },
      { id: 10, name: 'Thomas', number: 9, pos: 'AANVALLER', status: 'aanwezig' },

      { id: 12, name: 'Ruben', number: 12, pos: 'VERDEDIGER', status: 'aanwezig' }
